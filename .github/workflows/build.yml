name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: shots-studio-1.9.103/shots_studio

      - name: Build Release APK
        run: flutter build apk --flavor github --release --dart-define=BUILD_SOURCE=github
        working-directory: shots-studio-1.9.103/shots_studio

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shots-studio-mind-space-apk
          path: shots-studio-1.9.103/shots_studio/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
